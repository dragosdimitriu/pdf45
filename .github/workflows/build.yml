name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Headless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xkb1 libfontconfig1 libdbus-1-3 softhsm2
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build-linux:
    name: Build .deb
    needs: test
    runs-on: ubuntu-22.04   # oldest LTS = widest glibc compatibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/pdf45.spec
      - name: Smoke-run the bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 20 dist/pdf45/pdf45 --help || true
      - name: Build .deb
        run: |
          sudo apt-get install -y fakeroot
          packaging/linux/build_deb.sh
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: pdf45-linux-deb
          path: dist/*.deb

  build-windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest   # Inno Setup is preinstalled on the GitHub runner image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/pdf45.spec
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Inno Setup
        shell: cmd
        run: iscc /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\pdf45.iss
      - uses: actions/upload-artifact@v4
        with:
          name: pdf45-windows-setup
          path: dist/*-setup.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdf45-linux-deb/*.deb
            artifacts/pdf45-windows-setup/*.exe
